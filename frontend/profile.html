<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MARQRun - Mi Perfil</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<div id="header">
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    <img id="profilePic" src="assets/default-avatar.svg" alt="Perfil" onclick="toggleDropdown()">
    <div id="dropdown">
        <button onclick="window.location.href='profile.html'">Ver Perfil</button>
        <button onclick="logout()">Cerrar Sesión</button>
    </div>
</div>

<div class="profile-container">
    <div class="profile-header">
        <button class="back-btn" onclick="window.location.href='index.html'">← Volver</button>
    </div>

    <div class="profile-content">
        <div id="mensaje" class="mensaje" style="display:none;"></div>

        <div class="profile-card">
            <div class="profile-avatar-section">
                <img id="profileAvatar" src="assets/default-avatar.svg" alt="Avatar" class="profile-avatar">
                
            </div>

            <div class="profile-info">
                <h1 id="profileName">Nombre de usuario</h1>
                <p id="profileBio" class="profile-bio">Esta es mi biografía...</p>
                <p id="profileLocation" class="profile-location">📍 Ubicación</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="gruposCreados">0</div>
                <div class="stat-label">Grupos creados</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="entrenamientosAsistidos">0</div>
                <div class="stat-label">Entrenamientos asistidos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="entrenamientosCreados">0</div>
                <div class="stat-label">Entrenamientos creados</div>
            </div>
        </div>

        <div class="profile-actions">
            <button class="action-btn primary" onclick="abrirModal()">Editar perfil</button>
            <button class="action-btn secondary" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>
</div>

<!-- MODAL EDITAR PERFIL -->
<div id="editProfileModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%; max-height: 80%; overflow-y: auto;">
        <h3>Editar perfil</h3>
        <input id="modalEditNombre" placeholder="Nuevo nombre">
        <textarea id="modalEditBio" placeholder="Biografía (opcional)" rows="3" style="resize: vertical;"></textarea>
        <input id="modalEditLocation" placeholder="Ubicación personal (opcional)">
        <input id="modalEditAvatarUrl" placeholder="URL del avatar (opcional)">
        <input type="file" id="modalEditAvatarFile" accept="image/*" onchange="previewAvatarFileModal()">
        <div id="avatarCropControls" style="display:none; margin-top: 10px;">
            <button type="button" onclick="cropAvatarImage()">Recortar imagen</button>
            <p style="margin:8px 0 0; font-size: 13px; color: #555;">Ajusta el recorte cuadrado antes de guardar.</p>
        </div>
        <div id="modalAvatarPreviewContainer" style="display: none; margin-top: 10px;">
            <p style="margin: 0 0 6px; font-size: 13px; color: #555;">Vista previa original:</p>
            <img id="modalAvatarPreviewImage" style="max-width: 100px; max-height: 100px; border-radius: 50%;">
        </div>
        <div id="modalAvatarCropPreviewContainer" style="display: none; margin-top: 10px;">
            <p style="margin: 0 0 6px; font-size: 13px; color: #555;">Vista previa recortada:</p>
            <img id="modalAvatarCropPreviewImage" style="max-width: 100px; max-height: 100px; border-radius: 50%; border: 2px solid var(--button-bg);">
        </div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button onclick="guardarPerfilModal()" style="flex: 1;">Guardar</button>
            <button onclick="cerrarModal()" style="flex: 1; background: #6c757d;">Cancelar</button>
        </div>
    </div>
</div>

<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/profile.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const guardado = localStorage.getItem("usuario");
    if (!guardado) {
        window.location.href = 'login.html';
        return;
    }

    const user = JSON.parse(guardado);
    iniciarSesion(user);
    cargarPerfilCompleto();
});
</script>

</body>
</html>
